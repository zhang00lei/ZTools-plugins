<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aria2 多线程下载器 - ztools</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L12 16M12 16L7 11M12 16L17 11M4 20H20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-title">Aria2 多线程下载器</div>
        <div id="connectionStatus" class="status-badge disconnected" onclick="window.showAria2Diagnostics && window.showAria2Diagnostics()">
          <span class="status-dot"></span>
          <span id="statusText">正在连接引擎...</span>
        </div>
      </div>

      <div class="header-stats" id="headerStats" style="display: none;">
        <div class="stat-chip dl">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 5v14M19 12l-7 7-7-7"/>
          </svg>
          <span id="globalDlSpeed">0 KB/s</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="btnNewTask" class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          新建任务
        </button>
        <button id="btnOpenSettings" class="btn btn-icon-only" title="设置">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="tabs">
        <button class="tab-btn active" data-filter="all">全部 (<span id="countAll">0</span>)</button>
        <button class="tab-btn" data-filter="active">下载中 (<span id="countActive">0</span>)</button>
        <button class="tab-btn" data-filter="paused">已暂停 (<span id="countPaused">0</span>)</button>
        <button class="tab-btn" data-filter="stopped">已完成 (<span id="countStopped">0</span>)</button>
      </div>
    </div>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Empty State -->
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 20h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="empty-title">暂无下载任务</div>
        <div class="empty-subtitle">点击右上角“新建任务”或直接复制下载链接发起多线程下载</div>
      </div>

      <!-- Task List -->
      <div id="taskList" class="task-list" style="display: none;"></div>
    </main>
  </div>

  <!-- Modal 1: New Task Modal -->
  <div id="newTaskModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">🚀 新建多线程下载任务</div>
        <button class="modal-close closeModal">&times;</button>
      </div>

      <div class="form-group">
        <label class="form-label">下载链接 (URL)</label>
        <textarea id="inputUrl" class="form-input" placeholder="支持 HTTP / HTTPS / FTP / 磁力链 (Magnet)"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">保存路径</label>
        <div class="input-group">
          <input id="inputSaveDir" type="text" class="form-input" readonly>
          <button id="btnBrowseDir" class="btn btn-secondary">浏览...</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">自定义保存文件名 (可选)</label>
        <input id="inputOutName" type="text" class="form-input" placeholder="留空时自动识别：优先使用服务器返回的文件名，或从 URL 解析">
      </div>

      <div class="form-group">
        <label class="form-label">单服务器最大连接线程数 (1 - 16)</label>
        <div class="input-group">
          <input id="inputThreads" type="number" min="1" max="16" value="16" class="form-input">
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary closeModal">取消</button>
        <button id="btnSubmitNewTask" class="btn btn-primary">开始下载</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Settings Modal -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">⚙️ 下载器偏好设置</div>
        <button class="modal-close closeModal">&times;</button>
      </div>

      <div class="form-group">
        <label class="form-label">默认保存目录</label>
        <div class="input-group">
          <input id="settingSaveDir" type="text" class="form-input" readonly>
          <button id="btnSettingBrowseDir" class="btn btn-secondary">浏览...</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">默认最大线程数 (Max Split)</label>
        <input id="settingMaxThreads" type="number" min="1" max="16" value="16" class="form-input">
      </div>

      <div class="form-group">
        <label class="form-label">Aria2 RPC 端口</label>
        <input id="settingRpcPort" type="number" value="6800" class="form-input">
      </div>

      <div class="form-group">
        <label class="form-label">Aria2 RPC 密钥 (Secret token)</label>
        <input id="settingRpcSecret" type="password" placeholder="可选（默认为空）" class="form-input">
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary closeModal">取消</button>
        <button id="btnSaveSettings" class="btn btn-primary">保存设置</button>
      </div>
    </div>
  </div>

  <!-- Modal 3: Confirmation & Alert Dialog -->
  <div id="confirmModal" class="modal-overlay">
    <div class="modal confirm-modal">
      <div class="modal-header">
        <div id="confirmTitle" class="modal-title">⚠️ 确认操作</div>
        <button class="modal-close closeConfirmModal">&times;</button>
      </div>
      
      <div id="confirmMessage" class="confirm-message">
        确定要执行此操作吗？
      </div>

      <div id="confirmOptionContainer" class="confirm-option-container" style="display:none;margin-top:10px;">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#cbd5e1;cursor:pointer;user-select:none;">
          <input type="checkbox" id="chkDeleteFile" style="width:16px;height:16px;accent-color:#ef4444;cursor:pointer;">
          <span id="chkDeleteFileLabel">同时删除本地已下载的文件</span>
        </label>
      </div>

      <div class="modal-footer">
        <button id="btnConfirmCancel" class="btn btn-secondary">取消</button>
        <button id="btnConfirmOk" class="btn btn-primary btn-danger-glow">确定</button>
      </div>
    </div>
  </div>

  <!-- Include Scripts -->
  <script src="js/aria2-rpc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
